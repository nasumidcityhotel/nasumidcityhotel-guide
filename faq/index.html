<html lang="ja">

<head>

  <script>
    // 即時言語判定 (FOUC防止)
    (function () {
      const savedLang = localStorage.getItem('preferredLanguage');
      const userLang = savedLang || (navigator.language.startsWith('ja') ? 'ja' : 'en');
      if (userLang === 'en') {
        document.documentElement.classList.add('lang-en');
      }
    })();

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #8e44ad;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* 言語切り替えボタン */
    .lang-switch {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .lang-btn.active {
      background: white;
      color: var(--primary-color);
      font-weight: bold;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 検索・フィルターエリア */
    .controls {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus,
    select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.1);
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    #clearBtn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    /* FAQ リスト */
    .faq {
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .faq:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    summary {
      padding: 20px;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      position: relative;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      position: absolute;
      right: 20px;
      font-size: 1.5rem;
      color: var(--accent-color);
      transition: var(--transition);
    }

    details[open] summary::after {
      content: "−";
      transform: rotate(180deg);
    }

    .badge {
      background: var(--primary-color);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .q {
      flex-grow: 1;
    }

    .a {
      padding: 0 20px 20px 20px;
      border-top: 1px solid var(--border-color);
      background-color: #fafbfc;
    }

    .a p {
      padding-top: 15px;
      color: var(--text-main);
    }

    .source {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .pill {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    a.pill {
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--primary-color);
      transition: var(--transition);
      border: 1px solid transparent;
    }

    a.pill:hover {
      background: var(--accent-color);
      color: white;
    }

    .notice {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 12px;
      box-shadow: var(--shadow);
      color: var(--text-muted);
    }

    .footer-info {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 言語別表示制御 */
    [lang="en"] .lang-ja,
    [lang="ja"] .lang-en,
    html.lang-en .lang-ja,
    html:not(.lang-en) .lang-en {
      display: none !important;
    }

    html.lang-en .lang-en {
      display: block !important;
    }

    html:not(.lang-en) .lang-ja {
      display: block !important;
    }

    /* 適切なインライン表示のため */
    html.lang-en span.lang-en {
      display: inline !important;
    }

    html:not(.lang-en) span.lang-ja {
      display: inline !important;
    }
  </style>

</head>

        q: { ja: "塩原温泉の後に戻りやすいですか？", en: "Is it easy to return after Shiobara Onsen?" },
        a: {
          ja: ["はい、塩原温泉エリアからはお車やバスで約45〜50分ほどで戻ることが可能です。", "昼間に塩原の紅葉や滝を楽しみ、夜は駅前の当ホテルでゆっくりお休みいただくというスケジュールも人気です。"],
          en: ["Yes, you can return from the Shiobara Onsen area in about 45 to 50 minutes by car or bus.", "It is a popular choice to enjoy the autumn leaves or waterfalls in Shiobara during the day and then relax at our station-front hotel at night."]
        },
        sources: [
          {
            label: { ja: "近隣日帰り温泉ガイド", en: "Nearby Day-trip Hot Spring Guide" },
            url: "https://nasu-onsen-guide.netlify.app/"
          }
        ]
      },
      {
        id: "no-car-access",
        category: { ja: "周辺情報", en: "Neighborhood Info" },
        q: { ja: "車なしでも利用できますか？", en: "Can I use the hotel without a car?" },
        a: {
          ja: ["はい、那須塩原駅（西口）から徒歩圏内にあり、公共交通機関でのご利用に最適です。", "駅からは各観光地への路線バスやタクシー、レンタカーもすぐに見つかります。また、ホテルの目の前にはコンビニ（セブンイレブン）もあり便利です。"],
          en: ["Yes, we are within walking distance of Nasu-Shiobara Station (West Exit), making us ideal for those using public transport.", "Local buses to various sightseeing spots, taxis, and rental cars are all available near the station. There is also a 7-Eleven convenience store right in front of the hotel."]
        },
        sources: [
          {
            label: { ja: "那須地域観光ガイド", en: "Nasu Area Sightseeing Guide" },
            url: "https://nasu-area-guide.netlify.app/"
          }
        ]
      },
      {
        id: "sightseeing-business-balance",
        category: { ja: "滞在・チェックアウト", en: "Stay & Check-out" },
        q: { ja: "連泊で観光と出張を両立できますか？", en: "Can I balance sightseeing and business during consecutive stays?" },
        a: {
          ja: ["はい、全室Wi-Fi完備でデスクも備えておりますので、テレワークや出張にも対応可能です。", "お仕事の合間に近隣の日帰り温泉でリフレッシュしたり、休日は那須観光を楽しんだりと、ワーケーションのような滞在もおすすめです。"],
          en: ["Yes, all rooms are equipped with Wi-Fi and a desk, suitable for teleworking or business trips.", "We recommend a 'workation' style stay where you can refresh at a nearby day-trip hot spring between work tasks and enjoy Nasu sightseeing on your days off."]
        },
        sources: [
          {
            label: { ja: "近隣日帰り温泉ガイド", en: "Nearby Day-trip Hot Spring Guide" },
            url: "https://nasu-onsen-guide.netlify.app/"
          }
        ]
      }
    ];

    // -------------------------------
    // 表示ロジック
    // -------------------------------
    const $faqList = document.getElementById("faqList");
    const $searchInput = document.getElementById("searchInput");
    const $categorySelect = document.getElementById("categorySelect");
    const $clearBtnJa = document.getElementById("clearBtnJa");
    const $clearBtnEn = document.getElementById("clearBtnEn");
    const $resultCountJa = document.getElementById("resultCountJa");
    const $resultCountEn = document.getElementById("resultCountEn");
    const $lastUpdatedJa = document.getElementById("lastUpdatedJa");
    const $lastUpdatedEn = document.getElementById("lastUpdatedEn");

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function uniqueCategories(data) {
      return [...new Set(data.map(x => x.category[currentLang]))].sort((a, b) => a.localeCompare(b, currentLang));
    }

    function buildCategoryOptions() {
      const previousValue = $categorySelect.value;
      $categorySelect.innerHTML = "";

      const allOpt = document.createElement("option");
      allOpt.value = "all";
      allOpt.textContent = translations[currentLang].allCategories;
      $categorySelect.appendChild(allOpt);

      const cats = uniqueCategories(qaData);
      for (const c of cats) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        $categorySelect.appendChild(opt);
      }

      // もし前の選択が有効なら戻す（翻訳後の値でマッチするかは微妙だが）
      if (previousValue !== "all") {
        // 実際には言語切り替え時に選択をリセットする方が安全
        $categorySelect.value = "all";
      }
    }

    function matches(item, keyword, category) {
      const kw = keyword.trim().toLowerCase();
      const itemCat = item.category[currentLang];
      const inCategory = (category === "all") || (itemCat === category);
      if (!inCategory) return false;
      if (!kw) return true;

      const itemQ = item.q[currentLang];
      const itemA = item.a[currentLang] || [];
      const itemSources = (item.sources || []).map(s => s.label[currentLang]);

      const hay = [
        itemCat,
        itemQ,
        ...itemA,
        ...itemSources
      ].join(" ").toLowerCase();

      return hay.includes(kw);
    }

    function renderFaq(list) {
      $faqList.innerHTML = "";

      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "notice";
        empty.textContent = translations[currentLang].noResults;
        $faqList.appendChild(empty);
        return;
      }

      for (const item of list) {
        const details = document.createElement("details");
        details.className = "faq";
        details.id = item.id;

        const summary = document.createElement("summary");
        summary.innerHTML = `
      <span class="badge">${escapeHtml(item.category[currentLang])}</span>
      <div class="q">
        <p>${escapeHtml(item.q[currentLang])}</p>
      </div>
    `;

        const answer = document.createElement("div");
        answer.className = "a";
        // HTMLが含まれる場合があるので、エスケープせずに出力する可能性があるが
        // ここでは安全のために a タグ以外は考慮しないか、もしくはそのまま入れる
        answer.innerHTML = (item.a[currentLang] || []).map(p => `<p>${p}</p>`).join("");

        const source = document.createElement("div");
        source.className = "source";
        if (item.sources && item.sources.length > 0) {
          source.innerHTML = `
          <span class="pill">${translations[currentLang].sourceLabel}</span>
          ${(item.sources || []).map(s => {
            return `<a class="pill" href="${escapeHtml(s.url)}" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 15px; background: white; border: 2px solid #007aff; border-radius: 12px; text-decoration: none; color: #333; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #007aff; box-sizing: border-box;"><span style="flex: 1;">${escapeHtml(s.label[currentLang])}</span><span style="color: #007aff; margin-left: 10px;">＞</span></a>`;
          }).join("")}
        `;
        } else {
          source.style.display = "none";
        }

        answer.appendChild(source);
        details.appendChild(summary);
        details.appendChild(answer);
        $faqList.appendChild(details);
      }
    }

    function update() {
      const keyword = $searchInput.value || "";
      const category = $categorySelect.value || "all";
      const filtered = qaData.filter(item => matches(item, keyword, category));
      $resultCountJa.textContent = String(filtered.length);
      $resultCountEn.textContent = String(filtered.length);
      renderFaq(filtered);

      buildJsonLd(qaData);
    }

    function buildJsonLd(allData) {
      const top = allData.slice(0, 10);
      const jsonLd = {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": top.map(x => ({
          "@type": "Question",
          "name": x.q[currentLang],
          "acceptedAnswer": {
            "@type": "Answer",
            "text": (x.a[currentLang] || []).join("\n").replace(/<[^>]*>?/gm, '') // HTMLタグを除去
          }
        }))
      };
      const el = document.getElementById("faq-jsonld");
      el.textContent = JSON.stringify(jsonLd, null, 2);
    }

    function setLastUpdated() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const dateStr = `${yyyy}-${mm}-${dd}`;
      $lastUpdatedJa.textContent = dateStr;
      $lastUpdatedEn.textContent = dateStr;
    }

    // イベント
    $searchInput.addEventListener("input", () => update());
    $categorySelect.addEventListener("change", () => update());

    const clearHandler = () => {
      $searchInput.value = "";
      $categorySelect.value = "all";
      update();
    };
    $clearBtnJa.addEventListener("click", clearHandler);
    $clearBtnEn.addEventListener("click", clearHandler);

    // 初期化
    (function init() {
      // 保存された設定またはブラウザ言語の取得
      const savedLang = localStorage.getItem('preferredLanguage');
      const browserLang = navigator.language.startsWith('ja') ? 'ja' : 'en';
      const initialLang = savedLang || browserLang;

      setLanguage(initialLang);
      setLastUpdated();
    })();
  </script>

</body>

</html>
